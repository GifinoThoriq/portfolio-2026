<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loader 3 — ASCII Grid Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const CHARSET = '▓░█▒╬┼┤├┬┴┐┘└┌│─▪▫·+×÷';
  const FONT_SIZE = 14;
  let cols, rows, grid, wipeProgress;
  let startTime;
  const DURATION = 2000; // ms for the wipe
  const HOLD = 600;      // ms to hold black before restart

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    init();
  }

  function init() {
    cols = Math.ceil(canvas.width  / FONT_SIZE);
    rows = Math.ceil(canvas.height / (FONT_SIZE * 1.4));
    grid = Array.from({ length: rows }, () =>
      Array.from({ length: cols }, () => CHARSET[Math.floor(Math.random() * CHARSET.length)])
    );
    wipeProgress = 0;
    startTime = performance.now();
  }

  function easeOut(t) { return 1 - Math.pow(1 - t, 2.5); }

  function draw(ts) {
    requestAnimationFrame(draw);
    const elapsed = ts - startTime;

    if (elapsed < DURATION) {
      const t = easeOut(Math.min(elapsed / DURATION, 1));
      // diagonal wipe: cells are cleared when col+row < t*(cols+rows)
      const threshold = t * (cols + rows);

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = `${FONT_SIZE}px 'Space Mono', monospace`;
      ctx.textBaseline = 'top';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (c + r >= threshold) {
            const alpha = Math.min(1, (c + r - threshold + 1));
            ctx.fillStyle = `rgba(232,232,232,${alpha * 0.9})`;
            ctx.fillText(grid[r][c], c * FONT_SIZE, r * FONT_SIZE * 1.4);
          }
        }
      }
    } else if (elapsed < DURATION + HOLD) {
      // hold black
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    } else {
      // restart
      init();
    }
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
</script>
</body>
</html>

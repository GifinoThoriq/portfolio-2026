<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loader 5 — Pixel Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.65rem;
  }

  #label {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(0.6rem, 1.4vw, 0.75rem);
    letter-spacing: 0.25em;
    color: #e8e8e8;
    text-transform: uppercase;
  }

  /* Outer pixel bar shell */
  #bar-shell {
    width: min(480px, 80vw);
    border: 3px solid #e8e8e8;
    padding: 5px;
    display: flex;
    flex-direction: row;
    gap: 3px;
    height: 40px;
    align-items: stretch;
  }

  /* Individual pixel segments */
  .seg {
    flex: 1;
    background: transparent;
  }

  .seg.active {
    background: #e8e8e8;
  }

  #pct {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(0.75rem, 2vw, 1rem);
    letter-spacing: 0.1em;
    color: #e8e8e8;
  }

  #wrap.fade-out {
    animation: fadeOut 0.45s ease forwards;
  }

  @keyframes fadeOut {
    to { opacity: 0; transform: translateY(-4px); }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="label">Loading...</div>
  <div id="bar-shell"></div>
  <div id="pct">0%</div>
</div>

<script>
  const shell  = document.getElementById('bar-shell');
  const pctEl  = document.getElementById('pct');
  const wrap   = document.getElementById('wrap');

  const SEGS     = 24;
  const DURATION = 2000;
  const HOLD     = 600;

  // Build segments
  const segs = Array.from({ length: SEGS }, () => {
    const d = document.createElement('div');
    d.className = 'seg';
    shell.appendChild(d);
    return d;
  });

  function easeInOut(t) { return t < .5 ? 2*t*t : -1+(4-2*t)*t; }

  function update(n) {
    const active = Math.round((n / 100) * SEGS);
    segs.forEach((s, i) => s.classList.toggle('active', i < active));
    pctEl.textContent = n + '%';
  }

  let startTime;

  function run(ts) { startTime = ts; requestAnimationFrame(tick); }

  function tick(ts) {
    const elapsed = ts - startTime;
    if (elapsed < DURATION) {
      const n = Math.round(easeInOut(elapsed / DURATION) * 100);
      update(n);
      requestAnimationFrame(tick);
    } else {
      update(100);
      setTimeout(restart, HOLD);
    }
  }

  function restart() {
    wrap.classList.add('fade-out');
    setTimeout(() => {
      wrap.classList.remove('fade-out');
      wrap.style.opacity = '';
      update(0);
      requestAnimationFrame(run);
    }, 600);
  }

  requestAnimationFrame(run);
</script>
</body>
</html>

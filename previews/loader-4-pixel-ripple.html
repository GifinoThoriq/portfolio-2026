<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loader 4 — Pixel Ripple Dissolve</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl');

  const vert = `
    attribute vec2 a_pos;
    void main() { gl_Position = vec4(a_pos, 0., 1.); }
  `;

  const frag = `
    precision mediump float;
    uniform vec2  u_res;
    uniform float u_time;
    uniform float u_intensity;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3. - 2. * f);
      return mix(
        mix(hash(i), hash(i + vec2(1,0)), u.x),
        mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), u.x),
        u.y
      );
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / u_res;
      uv.y = 1. - uv.y;

      float n1 = noise(uv * 6. + u_time * 0.4);
      float n2 = noise(uv * 12. - u_time * 0.6 + n1);
      float n3 = noise(uv * 3.  + u_time * 0.2 + n2 * 0.5);

      float ripple = (n1 + n2 * 0.5 + n3 * 0.25) / 1.75;

      // green tint at low opacity
      vec3 green = vec3(0.353, 0.859, 0.541); // #5adb8a
      vec3 col = mix(vec3(0.), green, ripple * 0.25);

      // brightness based on noise
      col += ripple * 0.08 * vec3(1.);

      gl_FragColor = vec4(col * u_intensity, 1.);
    }
  `;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uRes  = gl.getUniformLocation(prog, 'u_res');
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uInt  = gl.getUniformLocation(prog, 'u_intensity');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  window.addEventListener('resize', resize);
  resize();

  // Animation: intensity 1 → 0 over FADE_DURATION, hold black, repeat
  const FADE_DURATION = 2500;
  const HOLD = 800;
  const CYCLE = FADE_DURATION + HOLD;
  let start = performance.now();

  function easeInOut(t) { return t < .5 ? 2*t*t : -1+(4-2*t)*t; }

  function frame(ts) {
    requestAnimationFrame(frame);
    const elapsed = (ts - start) % CYCLE;
    const t = Math.min(elapsed / FADE_DURATION, 1);
    const intensity = elapsed < FADE_DURATION ? 1 - easeInOut(t) : 0;

    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, ts * 0.001);
    gl.uniform1f(uInt, intensity);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  requestAnimationFrame(frame);
</script>
</body>
</html>
